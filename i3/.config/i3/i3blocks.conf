# Global properties
#
# The top properties below are applied to every block, but can be overridden.
# Each block command defaults to the script name to avoid boilerplate.
command=/usr/share/i3blocks/$BLOCK_NAME
separator_block_width=15
markup=none

# Suggested order (left → right):
# mic, wifi, iface, bandwidth, cpu, load, temp, ram, disk, volume, battery, caps/num, time

# Microphone mute indicator (shown only when muted)
[mic]
command=pactl get-source-mute @DEFAULT_SOURCE@ | grep -q yes && printf 'MIC MUTE\nMIC MUTE\n#FF5555\n'
interval=once
signal=10

# Wi-Fi SSID + signal quality
[wifi]
instance=wlp0s20f3
command=SSID=$(/usr/sbin/iwgetid -r "$BLOCK_INSTANCE"); QUALITY=$(grep "$BLOCK_INSTANCE" /proc/net/wireless | awk '{ print int($3 * 100 / 70) }'); [ -n "$SSID" ] && echo "$SSID $QUALITY%"
color=#8BE9FD
interval=10
separator=false

# # IPv4 address on Wi-Fi (pinned so VPN/tun0 does not take over)
# [iface]
# instance=wlp0s20f3
# command=/usr/share/i3blocks/iface -4
# color=#6272A4
# interval=10
# separator=false

# # Up/down rates on Wi-Fi
# [bandwidth]
# instance=wlp0s20f3
# interval=5

# # CPU usage (stock script colors: warn/crit)
[cpu_usage]
label=CPU
color=#FFB86C
interval=10
min_width=CPU: 100.00%
separator=false

# # Load average
# [load_average]
# interval=10
# separator=false

# CPU package temperature (sysfs; warn ≥70°C, crit ≥90°C)
[temperature]
command=t=$(awk '{printf "%d", $1/1000}' /sys/class/thermal/thermal_zone6/temp); printf '%d°C\n%d°C\n' "$t" "$t"; if [ "$t" -ge 90 ]; then echo '#FF5555'; elif [ "$t" -ge 70 ]; then echo '#F1FA8C'; fi
color=#50FA7B
interval=10

# Memory usage
[memory]
command=free -h | awk '/Mem:/ { printf("RAM: %s/%s\n", $3, $2) }'
color=#BD93F9
interval=15
separator=false

# Disk usage (root is tight; /home is a separate mount)
[disk]
command=df -h / | awk 'NR==2 { printf("DISK: %s/%s (%s)\n", $3, $2, $5) }'
color=#FF79C6
interval=30
separator=false

[disk]
instance=/home
command=df -h /home | awk 'NR==2 { printf("HOME: %s/%s (%s)\n", $3, $2, $5) }'
color=#FF79C6
interval=30

# Volume indicator
[volume]
label=♪
instance=Master
color=#50FA7B
interval=once
signal=10

# Battery indicator
[battery]
label=⚡
color=#F1FA8C
interval=30

# # Caps / Num lock
# [keyindicator]
# instance=CAPS
# interval=once
# signal=11

# [keyindicator]
# instance=NUM
# interval=once
# signal=11

# Date / time (weekday, no seconds — refresh once a minute)
[time]
command=date '+%a %d-%m %H:%M'
color=#F8F8F2
interval=60
