include theme.conf
include bindkeys.conf

# fonts
font_family Hack Regular Nerd Font Complete Mono
italic_font Hack Italic Nerd Font Complete Mono
bold_font Hack Bold Nerd Font Complete Mono
bold_italic_font Hack Bold Italic Nerd Font Complete Mono

font_size 16

# remote control: socket-only (other local kitty instances; not every process)
allow_remote_control socket-only

tab_bar_edge top
# leftover cells go bottom-right so fullscreen sits flush
placement_strategy top-left
window_padding_width 0

# tmux(FIX): copy/paste functionality
clipboard_control write-clipboard write-primary no-append

background_opacity 0.8
# background_blur 48