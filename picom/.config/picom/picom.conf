backend = "glx";
vsync = true;

# unredirect fullscreen windows (less compositing for video/games)
unredir-if-possible = true;

detect-client-opacity = false;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;

use-damage = true;

shadow = false;

fading = false;

opacity-rule = [
    "90:class_g = 'kitty'",
    "90:class_g = 'Code'",
    "90:class_g = 'Spotify'"
];
