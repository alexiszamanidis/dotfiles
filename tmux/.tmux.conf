# remap prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file
unbind r
bind r source-file ~/.tmux.conf

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R


# start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
# don't exit from tmux when closing a session
set -g detach-on-destroy off
# zero-out escape time delay
set -g escape-time 1
# scrollback (1M per pane was heavy on RAM)
set -g history-limit 100000
# enable mouse control (clickable windows, panes, resizable panes)
set-option -g mouse on
# renumber all windows when any window is closed
set -g renumber-windows on
# use system clipboard
set -g set-clipboard on
# kitty + nvim: truecolor and focus events (autoread, etc.)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -g focus-events on
# status
set -g status-interval 5
set -g status-position top
set -g status-left-length 200
set -g status-right ''

# Dracula (palette from dracula.sh)
# white #f8f8f2  gray #44475a  dark_gray #282a36
# dark_purple #6272a4  green #50fa7b  yellow #f1fa8c
set -g status-style "bg=default,fg=#f8f8f2"
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#6272a4"
set -g message-style "bg=#44475a,fg=#f8f8f2"
set -g mode-style "bg=#44475a,fg=#f8f8f2"
set -g status-left "#[bg=#50fa7b,fg=#282a36]#{?client_prefix,#[bg=#f1fa8c],} #S "
set -g window-status-separator ""
setw -g window-status-format "#[fg=#f8f8f2] #I #W"
setw -g window-status-current-format "#[fg=#f8f8f2,bg=#6272a4] #I #W "
setw -g window-status-activity-style bold
setw -g window-status-bell-style bold


# prevent tmux exiting with Ctrl-d
set-environment -g 'IGNOREEOF' 2

# override find-window with tmux-sessionizer
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

# move to next session
bind i switch-client -n
# move to previous session
bind o switch-client -p

# open new window
# default bind is 'c'
bind t new-window -c '#{pane_current_path}'

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
